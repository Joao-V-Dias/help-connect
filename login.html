<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HelpConnect</title>
    <link rel="stylesheet" href="./assets/css/provisorio.css"> </head>
<body>
    <div class="login-container">
        <header>
            <h1>HelpConnect</h1>
            <h2>Faça Login</h2>
        </header>
        <form class="login-form" action="#" method="POST">
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
            </div>
            <div class="input-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo de 8 caracteres">
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="links-adicionais">
            <a href="#">Esqueci minha senha</a>
            <span>|</span>
            <a href="cadastrar.html">Criar uma conta</a>
        </div>
    </div>
</body>
</html>
